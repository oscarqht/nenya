<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Nenya - Screenshot Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="../libs/daisyui@5.css">
    <link rel="stylesheet" href="../libs/daisyui@5-themes.css">
    <link rel="stylesheet" href="../shared/extension-utilities.css">
    <link rel="stylesheet" href="../libs/tldraw/tldraw.css">
    <link rel="stylesheet" href="./editor.css">
</head>

<body class="bg-base-200 h-screen overflow-hidden">
    <div class="screenshot-editor-shell">
        <header class="screenshot-editor-toolbar glass-nav">
            <div class="toolbar-title">
                <span class="toolbar-title-text">Screenshot Editor</span>
                <span class="toolbar-subtitle">tldraw annotation</span>
            </div>

            <div class="toolbar-actions">
                <label class="close-after-control" title="Close after copy or save">
                    <input type="checkbox" id="prop-close-after" class="checkbox checkbox-xs checkbox-primary">
                </label>
                <button class="btn btn-sm btn-outline btn-square h-8 min-h-8" id="action-decorate"
                    title="Toggle Arc Frame (D)" aria-pressed="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="4" />
                        <rect width="10" height="10" x="7" y="7" rx="2" />
                    </svg>
                </button>
                <button class="btn btn-sm btn-outline btn-square h-8 min-h-8" id="action-crop" title="Crop (C)"
                    aria-pressed="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2v14a2 2 0 0 0 2 2h14" />
                        <path d="M18 22V8a2 2 0 0 0-2-2H2" />
                    </svg>
                </button>
                <button class="btn btn-sm btn-outline btn-secondary btn-square h-8 min-h-8" id="action-copy" title="Copy">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                    </svg>
                </button>
                <button class="btn btn-sm btn-primary btn-square h-8 min-h-8" id="action-save" title="Save">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" x2="12" y1="15" y2="3" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="screenshot-editor-main">
            <div id="editor-status" class="editor-status">Loading screenshot...</div>
            <div id="tldraw-editor" class="tldraw-editor" aria-label="Screenshot annotation editor"></div>

            <div id="decoration-bar" class="decoration-floating-bar" role="region" aria-label="Screenshot decorations">
                <div class="decoration-bar-content glass-panel">
                    <button id="prop-decoration-toggle" class="btn btn-xs btn-circle btn-ghost decoration-toggle-btn active"
                        title="Toggle Arc decoration" aria-label="Toggle Arc decoration" aria-pressed="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="18" x="3" y="3" rx="4" />
                            <rect width="10" height="10" x="7" y="7" rx="2" />
                        </svg>
                    </button>

                    <div class="decoration-divider"></div>

                    <button id="preset-neutral" class="decoration-preset-dot preset-neutral" data-preset="neutral"
                        title="Clean Neutral theme" aria-label="Clean Neutral theme"></button>

                    <div class="decoration-slider-container" title="Adjust theme color">
                        <input type="range" id="prop-decoration-hue" min="0" max="360" value="165"
                            class="decoration-hue-slider" aria-label="Theme color hue">
                    </div>

                    <div class="decoration-presets-row">
                        <button class="decoration-preset-dot preset-mint active" data-preset="mint" title="Mint Teal"
                            aria-label="Mint Teal preset"></button>
                        <button class="decoration-preset-dot preset-sunset" data-preset="sunset" title="Sunset Coral"
                            aria-label="Sunset Coral preset"></button>
                        <button class="decoration-preset-dot preset-lavender" data-preset="lavender" title="Lavender"
                            aria-label="Lavender preset"></button>
                        <button class="decoration-preset-dot preset-ocean" data-preset="ocean" title="Ocean Blue"
                            aria-label="Ocean Blue preset"></button>
                        <button class="decoration-preset-dot preset-rose" data-preset="rose" title="Berry Rose"
                            aria-label="Berry Rose preset"></button>
                        <button class="decoration-preset-dot preset-dark" data-preset="dark" title="Midnight Slate"
                            aria-label="Midnight Slate preset"></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="./editor.js" type="module"></script>
</body>

</html>
